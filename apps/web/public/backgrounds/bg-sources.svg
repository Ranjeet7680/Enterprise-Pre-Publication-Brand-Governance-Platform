      <circle cx="0" cy="0" r="1.5" fill="#f59e0b" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Umber Foundation -->
  <rect width="1920" height="1080" fill="#070c09" />

