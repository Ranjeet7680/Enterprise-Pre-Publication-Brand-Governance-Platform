  </g>

  <!-- Glowing Knowledge Node Synapses -->
  <g fill="#fef08a">
    <circle cx="180" cy="380" r="5" opacity="0.95" filter="drop-shadow(0 0 6px #f59e0b)" />
    <circle cx="420" cy="280" r="6" opacity="0.95" filter="drop-shadow(0 0 8px #f59e0b)" />
    <circle cx="680" cy="390" r="5" opacity="0.9" />
    <circle cx="940" cy="250" r="7" opacity="1" filter="drop-shadow(0 0 10px #fbbf24)" />
    <circle cx="1220" cy="360" r="6.5" opacity="0.95" />
    <circle cx="1480" cy="260" r="6" opacity="0.9" />
    <circle cx="1760" cy="410" r="5" opacity="0.85" />
    <circle cx="490" cy="560" r="5.5" opacity="0.9" />
    <circle cx="820" cy="650" r="6.5" opacity="0.95" filter="drop-shadow(0 0 8px #10b981)" />
