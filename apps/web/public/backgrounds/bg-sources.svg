  <!-- Sacred Geometry Concentric Mandala (Canonical Truth Vault) -->
  <g stroke="#f59e0b" stroke-width="1.2" opacity="0.4" fill="none">
    <circle cx="1350" cy="420" r="160" stroke-dasharray="8 6" />
