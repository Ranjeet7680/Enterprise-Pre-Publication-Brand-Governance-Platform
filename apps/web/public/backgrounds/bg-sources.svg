<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Warm Golden Knowledge & Manuscript Glow -->
    <radialGradient id="sourcesGoldAura" cx="72%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.36" />
      <stop offset="45%" stop-color="#b45309" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
