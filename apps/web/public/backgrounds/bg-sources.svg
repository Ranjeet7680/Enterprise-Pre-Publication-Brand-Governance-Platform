    <radialGradient id="sourcesEmeraldGlow" cx="25%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
