    <polygon points="1350,680 1575,290 1125,290" stroke="#10b981" stroke-width="1.5" opacity="0.45" />
  </g>

  <!-- Neural Knowledge Graph Connections (Master Claims & Source Links) -->
  <g stroke="#fbbf24" stroke-width="1.6" opacity="0.55" fill="none">
    <path d="M 180 380 L 420 280 L 680 390 L 940 250 L 1220 360 L 1480 260 L 1760 410" />
    <path d="M 420 280 L 490 560 L 820 650 L 1220 360" />
    <path d="M 680 390 L 820 650 L 1080 730 L 1380 590 L 1480 260" />
    <path d="M 180 720 L 490 560 L 620 840 L 1080 730" />
    <path d="M 1380 590 L 1640 720 L 1760 410" />

    <!-- Illuminated Manuscript Arcs -->
