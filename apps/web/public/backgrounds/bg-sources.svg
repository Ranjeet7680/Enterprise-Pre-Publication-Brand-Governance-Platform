    <radialGradient id="sourcesEmeraldCore" cx="24%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
