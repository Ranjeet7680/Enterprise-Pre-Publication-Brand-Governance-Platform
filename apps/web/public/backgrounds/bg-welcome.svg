<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Radiant Golden Dawn & Ayurvedic Emerald Aura -->
    <radialGradient id="welcomeGoldAura" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#92400e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#040c08" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="welcomeEmeraldAura" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#040c08" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="welcomeTealAura" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#042f2e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040c08" stop-opacity="0" />
    </radialGradient>

    <!-- Sacred Botanical Grid Pattern -->
    <pattern id="botanicalGrid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#123522" stroke-width="0.8" opacity="0.45" />
      <circle cx="0" cy="0" r="1.5" fill="#34d399" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Rainforest Base -->
  <rect width="1920" height="1080" fill="#040c08" />

  <!-- Luminous Halos -->
  <circle cx="960" cy="320" r="850" fill="url(#welcomeGoldAura)" />
  <circle cx="380" cy="750" r="750" fill="url(#welcomeEmeraldAura)" />
  <circle cx="1580" cy="700" r="700" fill="url(#welcomeTealAura)" />

  <!-- Botanical Grid Foundation -->
  <rect width="1920" height="1080" fill="url(#botanicalGrid)" opacity="0.75" />

  <!-- Sacred Geometric Lotus & Ayurvedic Botanical Mandala -->
  <g stroke="#fbbf24" stroke-width="1.6" opacity="0.45" fill="none">
    <circle cx="960" cy="480" r="140" stroke-dasharray="10 6" />
    <circle cx="960" cy="480" r="260" stroke-dasharray="16 8" />
    <circle cx="960" cy="480" r="400" stroke-dasharray="4 8" />
    <circle cx="960" cy="480" r="560" stroke-dasharray="24 12" />

    <!-- 8 Sacred Lotus Petals -->
    <path d="M 960 340 C 920 390, 920 440, 960 480 C 1000 440, 1000 390, 960 340 Z" stroke="#34d399" stroke-width="2" />
    <path d="M 960 620 C 920 570, 920 520, 960 480 C 1000 520, 1000 570, 960 620 Z" stroke="#34d399" stroke-width="2" />
    <path d="M 820 480 C 870 440, 920 440, 960 480 C 920 520, 870 520, 820 480 Z" stroke="#34d399" stroke-width="2" />
    <path d="M 1100 480 C 1050 440, 1000 440, 960 480 C 1000 520, 1050 520, 1100 480 Z" stroke="#34d399" stroke-width="2" />

    <!-- Diagonal Sacred Rays -->
    <line x1="480" y1="0" x2="1440" y2="960" stroke="#f59e0b" stroke-dasharray="8 8" opacity="0.3" />
    <line x1="1440" y1="0" x2="480" y2="960" stroke="#f59e0b" stroke-dasharray="8 8" opacity="0.3" />
  </g>

  <!-- Luminous Golden Dewdrop Particles -->
  <g fill="#fef08a">
    <circle cx="960" cy="220" r="5" opacity="0.95" filter="drop-shadow(0 0 8px #fbbf24)" />
    <circle cx="680" cy="340" r="6" opacity="0.9" />
    <circle cx="1240" cy="340" r="6" opacity="0.9" />
    <circle cx="520" cy="560" r="5" opacity="0.85" filter="drop-shadow(0 0 6px #10b981)" />
    <circle cx="1400" cy="560" r="5" opacity="0.85" filter="drop-shadow(0 0 6px #10b981)" />
    <circle cx="780" cy="760" r="4.5" opacity="0.8" />
    <circle cx="1140" cy="760" r="4.5" opacity="0.8" />
    <circle cx="960" cy="740" r="6.5" opacity="0.95" filter="drop-shadow(0 0 10px #fbbf24)" />
  </g>

  <!-- Technical Branding Header -->
  <g fill="#34d399" opacity="0.55" font-family="monospace" font-size="11">
    <text x="80" y="105">NADI_NATURALS // LUXURY_AYURVEDIC_BOTANICALS</text>
    <text x="80" y="995">PRE-PUBLICATION_GOVERNANCE // ZERO_UNILATERAL_AUTHORITY</text>
    <text x="1460" y="105">98.5%_CERTIFIED_ORGANIC_BOTANICALS</text>
    <text x="1540" y="995">MASTER_SPEC_VERSION: v2.1</text>
  </g>
</svg>
