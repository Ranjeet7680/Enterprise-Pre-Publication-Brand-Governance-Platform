<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="auditShieldGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auditCrimsonGlow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
    </radialGradient>
    <pattern id="hexGrid" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
      <path d="M 30 0 L 60 17.32 L 60 52 L 30 69.28 L 0 52 L 0 17.32 Z" fill="none" stroke="#142c20" stroke-width="0.8" opacity="0.3" />
      <path d="M 30 69.28 L 60 86.6 L 60 121.28 L 30 138.56 L 0 121.28 L 0 86.6 Z" fill="none" stroke="#142c20" stroke-width="0.8" opacity="0.3" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#070c09" />
  <rect width="1920" height="1080" fill="url(#hexGrid)" />
  <circle cx="960" cy="486" r="650" fill="url(#auditShieldGlow)" />
  <circle cx="1632" cy="216" r="450" fill="url(#auditCrimsonGlow)" />

  <!-- Cryptographic Shield Outline (IS 43 SHA-256 Immutability) -->
  <g stroke="#10b981" stroke-width="1.5" opacity="0.15" fill="none">
    <path d="M 960 220 L 1180 300 V 550 C 1180 720 960 840 960 840 C 960 840 740 720 740 550 V 300 Z" />
    <path d="M 960 270 L 1130 330 V 530 C 1130 670 960 770 960 770 C 960 770 790 670 790 530 V 330 Z" stroke-dasharray="6 6" />
    <!-- Center Cryptographic Key Icon Lattice -->
    <circle cx="960" cy="470" r="45" />
    <path d="M 960 515 V 610 M 960 550 H 985 M 960 580 H 980" />
  </g>

  <!-- Blockchain Chain Links / Immutable Ledger Connectors -->
  <g stroke="#34d399" stroke-width="1" opacity="0.18" fill="none">
    <line x1="100" y1="540" x2="740" y2="540" stroke-dasharray="8 6" />
    <line x1="1180" y1="540" x2="1820" y2="540" stroke-dasharray="8 6" />
    <rect x="220" y="500" width="120" height="80" rx="8" stroke="#10b981" />
    <rect x="480" y="500" width="120" height="80" rx="8" stroke="#10b981" />
    <rect x="1320" y="500" width="120" height="80" rx="8" stroke="#10b981" />
    <rect x="1580" y="500" width="120" height="80" rx="8" stroke="#10b981" />
  </g>

  <!-- Tamper-evident Security Sensor Nodes -->
  <g fill="#34d399" opacity="0.4">
    <circle cx="280" cy="540" r="4" />
    <circle cx="540" cy="540" r="4" />
    <circle cx="1380" cy="540" r="4" />
    <circle cx="1640" cy="540" r="4" />
    <circle cx="960" cy="220" r="5" />
    <circle cx="960" cy="840" r="5" />
  </g>
</svg>