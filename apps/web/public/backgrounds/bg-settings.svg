<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Burnished Bronze & Gold Halos -->
    <radialGradient id="settingsBronzeGlow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.36" />
      <stop offset="50%" stop-color="#92400e" stop-opacity="0.14" />
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0b0905" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="settingsSlateGlow" cx="25%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0b0905" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Mechanical Grid -->
    <pattern id="settingsGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2c2214" stroke-width="0.8" opacity="0.45" />
      <circle cx="0" cy="0" r="1.5" fill="#f59e0b" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Bronze Foundation -->
  <rect width="1920" height="1080" fill="#0b0905" />

  <!-- Luminous Halos -->
  <circle cx="1280" cy="420" r="750" fill="url(#settingsBronzeGlow)" />
  <circle cx="480" cy="620" r="700" fill="url(#settingsSlateGlow)" />

  <!-- Mechanical Grid -->
  <rect width="1920" height="1080" fill="url(#settingsGrid)" opacity="0.8" />

  <!-- Precision Clockwork Governance Gear (36-Tooth Sprocket) -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.55" fill="none">
    <!-- Main Center Gear -->
    <circle cx="1320" cy="480" r="240" stroke-width="2.5" />
    <circle cx="1320" cy="480" r="210" stroke-width="1.5" stroke-dasharray="12 6" />
    <circle cx="1320" cy="480" r="140" stroke-width="2" />
    <circle cx="1320" cy="480" r="60" stroke-width="3" fill="#141108" fill-opacity="0.8" />
    <circle cx="1320" cy="480" r="16" fill="#f59e0b" />

    <!-- Gear Spokes -->
    <line x1="1320" y1="270" x2="1320" y2="420" stroke-width="2" />
    <line x1="1320" y1="540" x2="1320" y2="690" stroke-width="2" />
    <line x1="1110" y1="480" x2="1260" y2="480" stroke-width="2" />
    <line x1="1380" y1="480" x2="1530" y2="480" stroke-width="2" />
    <line x1="1170" y1="330" x2="1280" y2="440" stroke-width="2" />
    <line x1="1360" y1="520" x2="1470" y2="630" stroke-width="2" />
    <line x1="1170" y1="630" x2="1280" y2="520" stroke-width="2" />
    <line x1="1360" y1="440" x2="1470" y2="330" stroke-width="2" />
  </g>

  <!-- Secondary Interlocking Pinion Gear -->
  <g stroke="#d97706" stroke-width="1.8" opacity="0.45" fill="none">
    <circle cx="980" cy="720" r="140" stroke-dasharray="8 6" />
    <circle cx="980" cy="720" r="40" stroke-width="2" fill="#141108" fill-opacity="0.8" />
    <circle cx="980" cy="720" r="12" fill="#d97706" />
    <line x1="840" y1="720" x2="1120" y2="720" stroke-dasharray="4 4" />
    <line x1="980" y1="580" x2="980" y2="860" stroke-dasharray="4 4" />
  </g>

  <!-- Governance Calibration Dial with Degree Ticks -->
  <g stroke="#34d399" stroke-width="1.2" opacity="0.45" fill="none">
    <circle cx="480" cy="460" r="180" stroke-dasharray="14 8" />
    <circle cx="480" cy="460" r="280" stroke-dasharray="4 10" />
    <line x1="200" y1="460" x2="760" y2="460" stroke-dasharray="4 4" />
    <line x1="480" y1="180" x2="480" y2="740" stroke-dasharray="4 4" />
    <!-- Indicator needle -->
    <line x1="480" y1="460" x2="620" y2="320" stroke="#34d399" stroke-width="2.5" />
    <circle cx="480" cy="460" r="10" fill="#34d399" />
  </g>

  <!-- Technical Calibration Labels -->
  <g fill="#fbbf24" opacity="0.55" font-family="monospace" font-size="11">
    <text x="80" y="105">SYSTEM_SETTINGS // POLICY_ENGINE_REGULATION</text>
    <text x="80" y="995">CALIBRATION_DIAL: MASTER_BRAND_RIGIDITY_INDEX [92/100]</text>
    <text x="1460" y="105">DETERMINISTIC_RULES_VERSION: 2026.10</text>
    <text x="1540" y="995">ENFORCEMENT_MODE: STRICT</text>
  </g>
</svg>
