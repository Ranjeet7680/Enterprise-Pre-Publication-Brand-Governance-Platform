<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="studioCenterGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#022c22" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
    </radialGradient>
    <pattern id="precisionGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#13261c" stroke-width="0.8" opacity="0.35" />
      <circle cx="0" cy="0" r="1.5" fill="#10b981" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#070c09" />
  <rect width="1920" height="1080" fill="url(#precisionGrid)" />
  <circle cx="960" cy="350" r="700" fill="url(#studioCenterGlow)" />

  <!-- Laser Alignment Drafting Lines -->
  <g stroke="#10b981" stroke-width="1" opacity="0.08">
    <line x1="0" y1="120" x2="1920" y2="120" stroke-dasharray="8 8" />
    <line x1="0" y1="960" x2="1920" y2="960" stroke-dasharray="8 8" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke-dasharray="8 8" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke-dasharray="8 8" />
    <!-- Diagonal Framing Guides -->
    <line x1="0" y1="0" x2="300" y2="300" />
    <line x1="1920" y1="0" x2="1620" y2="300" />
  </g>

  <!-- Precision Corner Reticles -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.25">
    <path d="M 80 120 L 80 80 L 120 80" fill="none" />
    <path d="M 1840 120 L 1840 80 L 1800 80" fill="none" />
    <path d="M 80 960 L 80 1000 L 120 1000" fill="none" />
    <path d="M 1840 960 L 1840 1000 L 1800 1000" fill="none" />
  </g>
</svg>
