<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="assetsPurpleGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="assetsCyanGlow" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
    </radialGradient>
    <pattern id="isometricGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" stroke="#13261c" stroke-width="0.5" opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#070c09" />
  <rect width="1920" height="1080" fill="url(#isometricGrid)" />
  <circle cx="1536" cy="324" r="600" fill="url(#assetsPurpleGlow)" />
  <circle cx="384" cy="756" r="550" fill="url(#assetsCyanGlow)" />

  <!-- Golden Ratio Spiral & Crop Framing Guides -->
  <g stroke="#a78bfa" stroke-width="1.2" opacity="0.12" fill="none">
    <!-- 16:9, 1:1, 4:5, 9:16 Visual Guides -->
    <rect x="260" y="140" width="1400" height="800" rx="4" stroke-dasharray="10 10" />
    <rect x="560" y="140" width="800" height="800" rx="4" stroke="#06b6d4" opacity="0.15" />
    <rect x="640" y="140" width="640" height="800" rx="4" stroke="#34d399" opacity="0.12" />

    <!-- Golden Spiral Segments -->
    <path d="M 960 540 A 340 340 0 0 1 1300 880" />
    <path d="M 1300 880 A 550 550 0 0 1 750 1430" />
    <path d="M 960 540 A 210 210 0 0 0 750 330" />
    <path d="M 750 330 A 130 130 0 0 0 620 460" />
  </g>

  <!-- Chromatic Spectrum Ribbon Lines -->
  <g stroke-width="1" opacity="0.18">
    <path d="M 0 500 C 480 420, 960 620, 1920 480" stroke="#ec4899" fill="none" />
    <path d="M 0 520 C 480 440, 960 640, 1920 500" stroke="#8b5cf6" fill="none" />
    <path d="M 0 540 C 480 460, 960 660, 1920 520" stroke="#06b6d4" fill="none" />
    <path d="M 0 560 C 480 480, 960 680, 1920 540" stroke="#10b981" fill="none" />
  </g>

  <!-- Precision Viewport Crop Corners -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.3">
    <path d="M 540 160 L 540 120 L 580 120" fill="none" />
    <path d="M 1380 160 L 1380 120 L 1340 120" fill="none" />
    <path d="M 540 920 L 540 960 L 580 960" fill="none" />
    <path d="M 1380 920 L 1380 960 L 1340 960" fill="none" />
  </g>
</svg>