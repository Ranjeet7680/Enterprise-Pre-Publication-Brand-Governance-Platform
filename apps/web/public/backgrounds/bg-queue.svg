      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#070c09" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="queueEmeraldGlow" cx="80%" cy="40%" r="50%">
