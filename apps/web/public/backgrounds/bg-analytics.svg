<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Cyber Lime & Emerald Radar Halos -->
    <radialGradient id="analyticsLimeGlow" cx="68%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#4d7c0f" stop-opacity="0.14" />
      <stop offset="85%" stop-color="#365314" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#050d05" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="analyticsCyanGlow" cx="25%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#050d05" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Sweep Beam Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#65a30d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0" />
    </linearGradient>

    <!-- Hexagonal Telemetry Matrix -->
    <pattern id="hexGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.3 L 60 52 L 30 69.3 L 0 52 L 0 17.3 Z M 30 104 L 60 86.7 L 60 52 L 30 69.3 L 0 52 L 0 86.7 Z"
            fill="none" stroke="#173111" stroke-width="0.8" opacity="0.45" />
      <circle cx="30" cy="52" r="1.5" fill="#a3e635" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Lime Foundation -->
  <rect width="1920" height="1080" fill="#050d05" />

  <!-- Luminous Telemetry Radiance -->
  <circle cx="1320" cy="480" r="750" fill="url(#analyticsLimeGlow)" />
  <circle cx="480" cy="620" r="700" fill="url(#analyticsCyanGlow)" />

  <!-- Hexagonal Telemetry Mesh -->
  <rect width="1920" height="1080" fill="url(#hexGrid)" opacity="0.75" />

  <!-- Holographic Polar Radar Dome -->
  <g stroke="#a3e635" stroke-width="1.2" opacity="0.45" fill="none">
    <circle cx="1300" cy="500" r="120" stroke-dasharray="6 4" />
    <circle cx="1300" cy="500" r="220" stroke-dasharray="10 6" />
    <circle cx="1300" cy="500" r="340" stroke-dasharray="16 8" />
    <circle cx="1300" cy="500" r="460" stroke-dasharray="4 8" />

    <!-- 360-Degree Radial Navigation Axes -->
    <line x1="820" y1="500" x2="1780" y2="500" stroke-dasharray="4 4" />
    <line x1="1300" y1="20" x2="1300" y2="980" stroke-dasharray="4 4" />
    <line x1="960" y1="160" x2="1640" y2="840" stroke-dasharray="6 6" />
    <line x1="960" y1="840" x2="1640" y2="160" stroke-dasharray="6 6" />
  </g>

  <!-- Radar Rotary Sweep Wedge -->
  <path d="M 1300 500 L 1650 300 A 460 460 0 0 1 1760 500 Z" fill="url(#radarSweep)" opacity="0.5" />

  <!-- Ascending Metric Sparklines & Wavevectors -->
  <g fill="none">
    <!-- Primary Growth Arc (Precision Rate 98.4%) -->
    <path d="M 100 850 C 350 820, 600 680, 900 650 S 1400 420, 1820 320" stroke="#a3e635" stroke-width="3" opacity="0.7" />
    <path d="M 100 850 C 350 820, 600 680, 900 650 S 1400 420, 1820 320" stroke="#84cc16" stroke-width="8" opacity="0.2" />

    <!-- Secondary Feedback Velocity Arc -->
    <path d="M 100 920 C 400 900, 700 780, 1050 720 S 1500 560, 1820 460" stroke="#22d3ee" stroke-width="2" opacity="0.55" stroke-dasharray="8 6" />
  </g>

  <!-- Holographic Telemetry Milestone Nodes -->
  <g fill="#bef264">
    <circle cx="350" cy="820" r="5" opacity="0.95" filter="drop-shadow(0 0 8px #a3e635)" />
    <circle cx="680" cy="710" r="6" opacity="0.95" />
    <circle cx="1080" cy="620" r="6.5" opacity="1" filter="drop-shadow(0 0 10px #a3e635)" />
    <circle cx="1450" cy="460" r="7" opacity="1" filter="drop-shadow(0 0 12px #a3e635)" />
    <circle cx="1820" cy="320" r="6" opacity="0.95" />
  </g>

  <!-- Technical Telemetry Labels -->
  <g fill="#a3e635" opacity="0.55" font-family="monospace" font-size="11">
    <text x="80" y="105">GOVERNANCE_TELEMETRY // EVALUATION_BENCHMARK</text>
    <text x="80" y="995">SUGGESTION_ACCEPTANCE: 74.2% // CITATION_VALIDITY: 100.0%</text>
    <text x="1460" y="105">SEVERITY_WEIGHTED_ACCURACY: 98.4%</text>
    <text x="1560" y="995">SYSTEM_LATENCY: 14ms</text>
  </g>
</svg>
