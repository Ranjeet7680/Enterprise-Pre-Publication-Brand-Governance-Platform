<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="420">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e0a" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>

    <style>
      @keyframes dashAnim {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseApproved {
        0%, 100% { fill: #064e3b; stroke: #10b981; }
        50% { fill: #047857; stroke: #34d399; }
      }
      @keyframes alertFlash {
        0%, 100% { stroke: #e11d48; }
        50% { stroke: #fb7185; }
      }
      .dash-arrow { stroke-dasharray: 6 6; animation: dashAnim 1.2s linear infinite; }
      .approved-box { animation: pulseApproved 3s ease-in-out infinite; }
      .invalid-loop { stroke-dasharray: 5 5; animation: dashAnim 1.5s linear infinite reverse; }
    </style>
  </defs>

  <rect width="920" height="420" rx="16" fill="url(#bgGrad2)" stroke="#1a2e22" stroke-width="2" />

  <!-- Title -->
  <text x="40" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">
    Review State Machine &amp; Cryptographic Approval Invalidation (IS 13)
  </text>
  <text x="40" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    Server-Enforced Preconditions • SHA-256 Version Lock • Post-Approval Edit Invalidation
  </text>

  <!-- State 1: DRAFT -->
  <g transform="translate(60, 160)">
    <rect width="120" height="60" rx="10" fill="#111c15" stroke="#243d2f" stroke-width="2" />
    <text x="60" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">DRAFT</text>
    <text x="60" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">Version v1 (Mutable)</text>
  </g>

  <!-- Transition: Submit -->
  <path d="M 180 190 L 240 190" fill="none" stroke="#10b981" stroke-width="2.5" class="dash-arrow" />
  <polygon points="245,190 235,185 235,195" fill="#10b981" />
  <text x="212" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Submit</text>

  <!-- State 2: IN REVIEW -->
  <g transform="translate(245, 160)">
    <rect width="150" height="60" rx="10" fill="#13241b" stroke="#10b981" stroke-width="2" />
    <text x="75" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">IN REVIEW</text>
    <text x="75" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">Audit Pipeline Running</text>
  </g>

  <!-- Fork: Changes Requested (Up) -->
  <path d="M 320 160 L 320 110 L 450 110" fill="none" stroke="#f59e0b" stroke-width="2" class="dash-arrow" />
  <polygon points="455,110 445,105 445,115" fill="#f59e0b" />
  <text x="375" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Blockers Found</text>

  <!-- State 3: CHANGES REQUESTED -->
  <g transform="translate(455, 80)">
    <rect width="170" height="60" rx="10" fill="#241c10" stroke="#f59e0b" stroke-width="2" />
    <text x="85" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">CHANGES REQUESTED</text>
    <text x="85" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fde68a" text-anchor="middle">Blockers / Citations Unmet</text>
  </g>

  <!-- Fork: Direct Approval (Down) -->
  <path d="M 395 190 L 520 190" fill="none" stroke="#10b981" stroke-width="2.5" class="dash-arrow" />
  <polygon points="525,190 515,185 515,195" fill="#10b981" />
  <text x="460" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#34d399" text-anchor="middle">0 Blockers or Override</text>

  <!-- State 4: APPROVED -->
  <g transform="translate(525, 160)">
    <rect width="180" height="60" rx="10" class="approved-box" stroke-width="2.5" />
    <text x="90" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">APPROVED</text>
    <text x="90" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">Bound to SHA-256 Hash</text>
  </g>

  <!-- State 5: REJECTED (Bottom branch) -->
  <path d="M 320 220 L 320 280 L 450 280" fill="none" stroke="#f43f5e" stroke-width="2" class="dash-arrow" />
  <polygon points="455,280 445,275 445,285" fill="#f43f5e" />
  <text x="375" y="295" font-family="'Inter', sans-serif" font-size="10" fill="#fda4af" text-anchor="middle">Irreconcilable Policy Breach</text>

  <g transform="translate(455, 250)">
    <rect width="170" height="60" rx="10" fill="#241013" stroke="#f43f5e" stroke-width="2" />
    <text x="85" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">REJECTED</text>
    <text x="85" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fca5a5" text-anchor="middle">Logged to Audit Trail</text>
  </g>

  <!-- THE CRITICAL INVALIDATION LOOP (Post-approval edit) -->
  <path d="M 615 160 C 615 30, 245 30, 245 150" fill="none" stroke="#f43f5e" stroke-width="2.5" class="invalid-loop" />
  <polygon points="245,155 240,145 250,145" fill="#f43f5e" />

  <g transform="translate(340, 25)">
    <rect width="260" height="30" rx="6" fill="#1f090d" stroke="#e11d48" stroke-width="1.5" />
    <text x="130" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle">
      ANY EDIT INVALIDATES APPROVAL (v2 Created)
    </text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(60, 345)">
    <rect width="800" height="48" rx="10" fill="#0c1611" stroke="#1d3627" />
    <text x="24" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
      Accountable Human Governance Principle:
    </text>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      Approval applies only to the exact immutable content hash. Models cannot publish, and silent bypasses are mathematically impossible.
    </text>
  </g>
</svg>
