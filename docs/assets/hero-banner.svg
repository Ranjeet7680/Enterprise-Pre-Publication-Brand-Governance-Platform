<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="320">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c09" />
      <stop offset="50%" stop-color="#0d1813" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes scanBeam {
        0% { transform: translateY(-30px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(330px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes badgePulse {
        0%, 100% { filter: drop-shadow(0 0 2px #10b981); }
        50% { filter: drop-shadow(0 0 10px #34d399); }
      }
      .scanner { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .ambient-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .dash-flow { stroke-dasharray: 6 6; animation: dashMove 2s linear infinite; }
      .floating-node { animation: floatNode 4s ease-in-out infinite; }
      .floating-node-2 { animation: floatNode 5s ease-in-out infinite 1s; }
      .brand-badge { animation: badgePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="960" height="320" rx="16" fill="url(#bgGradient)" stroke="#1a2e22" stroke-width="2" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#064e3b" opacity="0.25" filter="url(#glow)" class="ambient-glow" />
  <circle cx="780" cy="240" r="160" fill="#047857" opacity="0.2" filter="url(#glow)" class="ambient-glow" />

  <!-- Background Tech Grid Lines -->
  <g stroke="#16291e" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
    <line x1="760" y1="0" x2="760" y2="320" />
    <line x1="880" y1="0" x2="880" y2="320" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
  </g>

  <!-- Circuit Data Flow Paths -->
  <path d="M 120 260 L 260 260 L 320 200 L 640 200 L 700 260 L 840 260" fill="none" stroke="#1c3d2b" stroke-width="2" />
  <path d="M 120 260 L 260 260 L 320 200 L 640 200 L 700 260 L 840 260" fill="none" stroke="#10b981" stroke-width="2" class="dash-flow" />

  <!-- Scanning Beam Effect -->
  <g class="scanner">
    <line x1="40" y1="0" x2="920" y2="0" stroke="url(#scanGradient)" stroke-width="2" filter="url(#softGlow)" />
    <polygon points="40,0 920,0 880,18 80,18" fill="url(#scanGradient)" opacity="0.15" />
  </g>

  <!-- Brand Emblem / Shield Icon -->
  <g transform="translate(68, 60)" class="floating-node">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#0d2117" stroke="#10b981" stroke-width="2" filter="url(#softGlow)" />
    <!-- Shield Geometry -->
    <path d="M 38 18 L 56 26 C 56 44 48 54 38 60 C 28 54 20 44 20 26 Z" fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="round" />
    <path d="M 31 38 L 36 43 L 46 33" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Header Title & Tagline -->
  <text x="164" y="98" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#textGrad)" letter-spacing="1.5">
    INKLOOM AI
  </text>
  <text x="398" y="96" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399" letter-spacing="1">
    [BLUEPRINT v1.2 SPECIFICATION]
  </text>

  <text x="164" y="128" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Enterprise Pre-Publication Brand Governance Platform
  </text>

  <text x="164" y="152" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748b">
    Deterministic Rules • Grounded RAG • Visual &amp; WCAG Governance • Indian Languages &amp; Voice Safety
  </text>

  <!-- Interactive Pillar Feature Pills -->
  <g transform="translate(164, 185)">
    <!-- Pill 1: Hybrid Deterministic -->
    <rect x="0" y="0" width="168" height="34" rx="8" fill="#0b1a13" stroke="#1e3a29" stroke-width="1.5" />
    <circle cx="16" cy="17" r="4" fill="#10b981" />
    <text x="28" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Hybrid Rule Engine</text>

    <!-- Pill 2: Evidence Bounded RAG -->
    <rect x="180" y="0" width="160" height="34" rx="8" fill="#0b1a13" stroke="#1e3a29" stroke-width="1.5" />
    <circle cx="196" cy="17" r="4" fill="#38bdf8" />
    <text x="208" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Approved Source RAG</text>

    <!-- Pill 3: Cryptographic Approval -->
    <rect x="352" y="0" width="176" height="34" rx="8" fill="#0b1a13" stroke="#1e3a29" stroke-width="1.5" />
    <circle cx="368" cy="17" r="4" fill="#f59e0b" />
    <text x="380" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">SHA-256 State Machine</text>

    <!-- Pill 4: Multilingual & Voice -->
    <rect x="540" y="0" width="186" height="34" rx="8" fill="#0b1a13" stroke="#1e3a29" stroke-width="1.5" />
    <circle cx="556" cy="17" r="4" fill="#ec4899" />
    <text x="568" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Indic Languages &amp; Voice</text>
  </g>

  <!-- Bottom Telemetry Banner -->
  <g transform="translate(68, 252)">
    <rect x="0" y="0" width="824" height="42" rx="10" fill="#09120d" stroke="#172b1f" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#10b981" class="brand-badge" />
    <text x="38" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="600">
      SYSTEM STATUS: OPERATIONAL
    </text>

    <text x="240" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
      PRECISION: <tspan fill="#e2e8f0" font-weight="600">100%</tspan> | RECALL: <tspan fill="#e2e8f0" font-weight="600">100%</tspan> | CITATION VALIDITY: <tspan fill="#e2e8f0" font-weight="600">100%</tspan>
    </text>

    <text x="735" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" font-weight="600">
      PASS (11/11 TESTS)
    </text>
  </g>
</svg>
