<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="440">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e0a" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>

    <style>
      @keyframes pipeFlow {
        from { stroke-dashoffset: 30; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-10px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateY(350px); opacity: 0.2; }
      }
      .pipe-line { stroke-dasharray: 5 5; animation: pipeFlow 1.2s linear infinite; }
      .pipeline-scan { animation: scanBeam 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="940" height="440" rx="16" fill="url(#bgGrad3)" stroke="#1a2e22" stroke-width="2" />

  <!-- Title -->
  <text x="40" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">
    9-Stage Hybrid Inspection Dependency Graph (IS 13 &amp; ADR 003)
  </text>
  <text x="40" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    Deterministic Code for Exact Constraints • Bounded RAG &amp; Specialized AI for Semantic Nuance
  </text>

  <!-- Input Node (Left) -->
  <g transform="translate(40, 150)">
    <rect width="130" height="130" rx="12" fill="#0d1b14" stroke="#1b3927" stroke-width="2" />
    <text x="65" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">SUBMISSION</text>
    <text x="65" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">Text Draft</text>
    <text x="65" y="76" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">Visual Asset</text>
    <text x="65" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">Locale &amp; Channel</text>
    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" text-anchor="middle">SHA-256 Seeded</text>
  </g>

  <!-- Pipeline Connector 1 -->
  <path d="M 170 215 L 210 215" fill="none" stroke="#10b981" stroke-width="2" class="pipe-line" />

  <!-- PHASE 1: Deterministic Engine (Center-Left) -->
  <g transform="translate(210, 95)">
    <rect width="210" height="240" rx="12" fill="#0b1712" stroke="#10b981" stroke-width="1.5" />
    <rect width="210" height="28" rx="12" fill="#102d1e" />
    <text x="14" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">
      PHASE 1: DETERMINISTIC
    </text>

    <!-- Stage 1 -->
    <g transform="translate(10, 36)">
      <rect width="190" height="42" rx="6" fill="#07100b" stroke="#142c1e" />
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f87171">1. Prompt Injection Guard</text>
      <text x="10" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Untrusted input boundary (IS 17)</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(10, 84)">
      <rect width="190" height="42" rx="6" fill="#07100b" stroke="#142c1e" />
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">2. Terminology Glossary</text>
      <text x="10" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Prohibited terms &amp; exceptions (IS 08)</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(10, 132)">
      <rect width="190" height="42" rx="6" fill="#07100b" stroke="#142c1e" />
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f59e0b">3. Freshness &amp; Expiry</text>
      <text x="10" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Campaign dates &amp; offers (IS 05)</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(10, 180)">
      <rect width="190" height="42" rx="6" fill="#07100b" stroke="#142c1e" />
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">4. Superlatives &amp; Disclosures</text>
      <text x="10" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Clinical footnotes required (IS 04)</text>
    </g>
  </g>

  <!-- Pipeline Connector 2 -->
  <path d="M 420 215 L 460 215" fill="none" stroke="#38bdf8" stroke-width="2" class="pipe-line" />

  <!-- PHASE 2: Bounded RAG & Specialized AI (Center-Right) -->
  <g transform="translate(460, 95)">
    <rect width="230" height="240" rx="12" fill="#0b1712" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="230" height="28" rx="12" fill="#0c2331" />
    <text x="14" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">
      PHASE 2: RAG &amp; SPECIALIZED AI
    </text>

    <!-- Stage 5 -->
    <g transform="translate(10, 36)">
      <rect width="210" height="34" rx="6" fill="#07100b" stroke="#122a36" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">5. Bounded Evidence RAG</text>
      <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Contradiction vs Unverified (IS 06)</text>
    </g>

    <!-- Stage 6 -->
    <g transform="translate(10, 76)">
      <rect width="210" height="34" rx="6" fill="#07100b" stroke="#122a36" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#c084fc">6. Brand Tone &amp; Style</text>
      <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Warmth, empathy, sarcasm (IS 07)</text>
    </g>

    <!-- Stage 7 -->
    <g transform="translate(10, 116)">
      <rect width="210" height="34" rx="6" fill="#07100b" stroke="#122a36" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f59e0b">7. Logo Geometry Inspector</text>
      <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Master 3.5:1 ratio stretch guard (IS 10)</text>
    </g>

    <!-- Stage 8 -->
    <g transform="translate(10, 156)">
      <rect width="210" height="34" rx="6" fill="#07100b" stroke="#122a36" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#34d399">8. WCAG 2.1 Contrast (4.5:1)</text>
      <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Luminance formula &amp; Alt-Text (IS 11)</text>
    </g>

    <!-- Stage 9 -->
    <g transform="translate(10, 196)">
      <rect width="210" height="34" rx="6" fill="#07100b" stroke="#122a36" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#fb7185">9. Indic Nuance &amp; Hinglish</text>
      <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Code-switching &amp; transliteration (IS 12)</text>
    </g>
  </g>

  <!-- Pipeline Connector 3 -->
  <path d="M 690 215 L 730 215" fill="none" stroke="#10b981" stroke-width="2" class="pipe-line" />

  <!-- Output: Canonical Finding Schema (Right) -->
  <g transform="translate(730, 125)">
    <rect width="170" height="180" rx="12" fill="#0d1b14" stroke="#1b3927" stroke-width="2" />
    <text x="85" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">CANONICAL FINDING</text>
    <text x="85" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fca5a5" text-anchor="middle">• Severity Tier</text>
    <text x="85" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">• Flagged Text Span</text>
    <text x="85" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">• Verified Citation</text>
    <text x="85" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="middle">• Replacement Patch</text>
    <text x="85" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f59e0b" text-anchor="middle">• Confidence Band</text>
    <text x="85" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">IS 33 Schema Enforced</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 360)">
    <rect width="860" height="48" rx="10" fill="#0a140f" stroke="#172b1f" />
    <text x="24" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
      Zero Blind Spots Architecture:
    </text>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      Deterministic code prevents hallucination and guarantees reproducible blocker enforcement; AI supplies contextual rewrites.
    </text>
  </g>
</svg>
